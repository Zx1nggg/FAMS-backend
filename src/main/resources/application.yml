server:
  port: 8080
  servlet:
    context-path: /api # 服务器上下文路径

spring:
  application:
    name: FAMS

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/fams?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: is_deleted # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值
      logic-not-delete-value: 0 # 逻辑未删除值
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true # 开启驼峰命名

app:
  upload:
    avatar-dir: ${AVATAR_DIR:uploads/avatar}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai-responses}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    max-tool-rounds: ${AI_MAX_TOOL_ROUNDS:6}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1600}
    history-limit: ${AI_HISTORY_LIMIT:16}
    request-timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    per-minute-request-limit: ${AI_PER_MINUTE_REQUEST_LIMIT:10}
    daily-request-limit: ${AI_DAILY_REQUEST_LIMIT:200}
    stream-timeout-seconds: ${AI_STREAM_TIMEOUT_SECONDS:120}
    knowledge-enabled: ${AI_KNOWLEDGE_ENABLED:false}
    vector-store-id: ${AI_VECTOR_STORE_ID:}
    knowledge-max-results: ${AI_KNOWLEDGE_MAX_RESULTS:8}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24小时
  token-header: Authorization
  token-prefix: Bearer
